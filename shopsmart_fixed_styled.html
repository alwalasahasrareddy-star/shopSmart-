<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopSmart | AI Shopping Demo</title>
        <style type="text/css">
            *{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font:15px/1.5 Arial,sans-serif}button{cursor:pointer;font:inherit;border:0;border-radius:9px;padding:10px 15px;background:#315efb;color:white;font-weight:bold}.top{background:#17213a;color:white;text-align:center;padding:7px;font-size:12px}.nav{position:sticky;top:0;background:white;border-bottom:1px solid #e3e7ef;padding:14px max(calc((100% - 1100px)/2),20px);display:flex;gap:18px;align-items:center;z-index:2}.logo{font-size:23px;font-weight:900;color:#315efb;cursor:pointer}.search{display:flex;flex:1}.search input{width:100%;padding:11px;border:1px solid #e1e5ee;border-radius:9px 0 0 9px}.search button{border-radius:0 9px 9px 0}.nav button{white-space:nowrap}.wrap{max-width:1100px;margin:auto;padding:25px 20px}.hero{padding:42px;border-radius:18px;color:white;background:linear-gradient(115deg,#172b53,#315efb);display:flex;justify-content:space-between;align-items:center}.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.08;margin:12px 0}.hero p{max-width:560px;color:#dce5ff}.hero .art{font-size:100px}.light{background:white;color:#315efb}.muted{color:#718096}.rowtitle{display:flex;justify-content:space-between;align-items:center;margin:30px 0 14px}.chips{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.chip{background:white;color:#42506a;border:1px solid #dfe4ed;border-radius:30px}.chip.active{background:#eef2ff;color:#315efb;border-color:#315efb}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:white;border:1px solid #e4e8ef;border-radius:14px;overflow:hidden;cursor:pointer;transition:.18s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 25px #17213a15}.pic{height:155px;background:linear-gradient(135deg,#eaf0ff,#f7f8fc);display:grid;place-items:center;font-size:70px;position:relative}.tag{position:absolute;top:9px;left:9px;background:white;border-radius:20px;padding:4px 9px;font-size:11px;color:#315efb;font-weight:bold}.info{padding:13px}.info h3{font-size:15px;margin:0 0 5px}.stars{color:#e49b16}.price{font-weight:900;font-size:18px;margin:7px 0}.old{font-size:12px;color:#9aa3b2;text-decoration:line-through;font-weight:normal}.info button{width:100%;margin-top:8px}.banner,.hint{background:#eaf8f2;border:1px solid #cceedd;border-radius:12px;padding:15px;margin:22px 0}.hint{background:#eef2ff;border-color:#d8e0ff;color:#354b9a}.detail,.cartlayout{display:grid;grid-template-columns:1fr 1fr;gap:25px;background:white;padding:22px;border:1px solid #e3e7ef;border-radius:16px}.bigpic{background:#edf2ff;border-radius:13px;display:grid;place-items:center;font-size:150px;min-height:330px}.detail h1{line-height:1.2}.detail .price{font-size:27px}.cartlayout{grid-template-columns:1.5fr .8fr;background:transparent;border:0;padding:0}.cartitem,.summary{background:white;border:1px solid #e3e7ef;border-radius:12px;padding:15px;margin-bottom:12px;display:flex;align-items:center;gap:14px}.mini{background:#edf2ff;border-radius:9px;padding:12px;font-size:35px}.summary{display:block;align-self:start}.sumline{display:flex;justify-content:space-between;margin:12px 0}.empty{text-align:center;padding:60px 15px;background:white;border:1px solid #e3e7ef;border-radius:15px}.empty .emoji{font-size:60px}.crumb{color:#718096;margin-bottom:18px;font-size:13px}.footer{background:#17213a;color:#dce5f5;text-align:center;padding:25px;margin-top:45px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17213a;color:white;padding:12px 18px;border-radius:9px;opacity:0;transition:.2s}.toast.show{opacity:1}
            @media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.hero .art{font-size:65px}.nav{gap:9px}.detail,.cartlayout{grid-template-columns:1fr}}@media(max-width:520px){.nav{flex-wrap:wrap;padding:12px}.search{order:3;flex-basis:100%}.hero{padding:25px}.hero .art{display:none}.grid{gap:9px}.pic{height:120px;font-size:55px}.info{padding:9px}.wrap{padding:18px 12px}}
            html{min-width:320px}body{min-height:100vh}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #9bb4ff;outline-offset:2px}a{cursor:pointer;color:#315efb}
        </style>
    </head>

    <body>
        <div class="top">✨ SHOPSMART DEMO — AI-powered product recommendations in action</div>
        <header class="nav"><div class="logo" onclick="home()">ShopSmart.</div><div class="search"><input id="q" placeholder="Search products..." onkeydown="if(event.key==='Enter')search()"><button onclick="search()">Search</button></div><button onclick="home()">Home</button><button onclick="catalog()">Shop</button><button onclick="cartPage()">🛒 Cart <span id="count">0</span></button></header>
        <noscript><div style="margin:24px;padding:18px;background:#fff3cd;border:1px solid #ffe69c;border-radius:12px;font:14px Arial,sans-serif">Please enable JavaScript to use the ShopSmart interactive demo.</div></noscript><main id="app"></main><footer class="footer">ShopSmart · AI Retail Recommendation Engine · Interactive educational demo</footer><div id="toast" class="toast"></div>
        <script>
            const P=[
            [1,'Sonic Pro Wireless Headphones','Electronics',2499,3499,'🎧','Best seller','Wireless over-ear headphones with rich sound and comfortable ear cushions.'],
            [2,'FitTrack Smart Watch','Electronics',3299,4499,'⌚','Popular','A smart wearable for activity tracking, notifications, and everyday fitness.'],
            [3,'StreetFlex Running Shoes','Fashion',1899,2599,'👟','Trending','Lightweight running shoes with a breathable upper and cushioned sole.'],
            [4,'Urban Everyday Backpack','Fashion',1299,1799,'🎒','Value pick','A versatile backpack for commuting, campus, and travel.'],
            [5,'Glow Mini Desk Lamp','Home',899,1199,'💡','New','A compact desk lamp for a comfortable study or work setup.'],
            [6,'BrewMate Coffee Maker','Home',2199,2899,'☕','Top rated','A simple coffee maker for preparing a fresh cup at home.'],
            [7,'SnapShot Instant Camera','Electronics',4999,5999,'📸','Popular','An instant camera for capturing and printing memorable moments.'],
            [8,'CloudSoft Hoodie','Fashion',1599,2199,'🧥','Top rated','A soft casual hoodie for relaxed everyday wear.'],
            [9,'Pulse Bluetooth Speaker','Electronics',1799,2499,'🔊','Trending','A portable Bluetooth speaker with clear sound for music at home or outdoors.'],
            [10,'Pro Wireless Mouse','Electronics',899,1299,'🖱️','Value pick','An ergonomic wireless mouse for work, study, and everyday browsing.'],
            [11,'Nova Tablet 10-inch','Electronics',12999,15999,'📱','New arrival','A versatile tablet for entertainment, reading, and productivity.'],
            [12,'HD Smart Television','Electronics',18999,23999,'📺','Best seller','A smart television for streaming shows, movies, and online content.'],
            [13,'Classic Denim Jacket','Fashion',2199,2999,'🧥','Popular','A versatile denim jacket for casual everyday outfits.'],
            [14,'Everyday Sneakers','Fashion',1499,2099,'👟','Trending','Comfortable sneakers designed for daily wear and walking.'],
            [15,'Minimalist Wrist Watch','Fashion',1799,2499,'⌚','Top rated','A clean and stylish wrist watch for everyday use.'],
            [16,'Cotton Casual Shirt','Fashion',999,1499,'👔','Value pick','A comfortable cotton shirt suitable for casual and smart-casual looks.'],
            [17,'Cozy Cushion Set','Home',699,999,'🛋️','New arrival','Soft decorative cushions to add comfort and colour to your living space.'],
            [18,'Insulated Travel Mug','Home',549,799,'🥤','Popular','A reusable insulated mug for keeping drinks handy while travelling.'],
            [19,'Indoor Plant Pot','Home',399,599,'🪴','Trending','A decorative planter for adding a touch of greenery to your home.'],
            [20,'LED String Lights','Home',499,799,'✨','Best seller','Decorative LED lights for bedrooms, celebrations, and cosy spaces.']];
            let cart=JSON.parse(localStorage.getItem('sscart')||'[]'),cat='All',term='';
            const money=n=>'₹'+n.toLocaleString('en-IN'),get=id=>P.find(p=>p[0]===id);
            function sync(){localStorage.setItem('sscart',JSON.stringify(cart));document.getElementById('count').textContent=cart.reduce((a,b)=>a+b.qty,0)}
            function notify(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
            function card(p){return `<article class="card" onclick="detail(${p[0]})"><div class="pic"><span class="tag">${p[6]}</span>${p[5]}</div><div class="info"><h3>${p[1]}</h3><div class="stars">★★★★★ <span class="muted">4.8</span></div><div class="price">${money(p[3])} <span class="old">${money(p[4])}</span></div><button onclick="event.stopPropagation();add(${p[0]})">Add to cart</button></div></article>`}
            function products(title,arr,sub=''){return `<div class="rowtitle"><div><h2>${title}</h2><span class="muted">${sub}</span></div><button onclick="catalog()">View all →</button></div><div class="grid">${arr.map(card).join('')}</div>`}
            function home(){scrollTo(0,0);document.getElementById('app').innerHTML=`<div class="wrap"><section class="hero"><div><small>PERSONALIZED SHOPPING EXPERIENCE</small><h1>Find what you love.<br>Discover more.</h1><p>Explore products selected for your interests. This interactive demo shows how an AI recommendation engine can personalize an online store.</p><button class="light" onclick="catalog()">Start shopping →</button></div><div class="art">🛍️</div></section><div class="rowtitle"><h2>Shop by category</h2></div><div class="chips">${['All','Electronics','Fashion','Home'].map(c=>`<button class="chip" onclick="cat='${c}';catalog()">${c}</button>`).join('')}</div><div class="banner"><b>✨ AI pick for you</b><span>Viewed headphones? You may also like a smartwatch.</span><button onclick="detail(2)">See recommendation</button></div>${products('Trending products',P.slice(0,4),'Popular choices from our store')}${products('Recommended for you',[P[1],P[0],P[3],P[2]],'Sample personalized suggestions based on browsing activity')}<div class="hint">🤖 <b>AI simulation:</b> Recommendations are selected using category and sample browsing patterns. A real system learns from clicks, purchases, ratings, and other customer signals.</div></div>`}
            function catalog(){scrollTo(0,0);let a=P.filter(p=>(cat==='All'||p[2]===cat)&&(!term||(p[1]+' '+p[2]).toLowerCase().includes(term)));document.getElementById('app').innerHTML=`<div class="wrap"><div class="crumb" onclick="home()">Home / Shop</div><h1>Explore products</h1><p class="muted">Choose a product to open its details page.</p><div class="chips">${['All','Electronics','Fashion','Home'].map(c=>`<button class="chip ${cat===c?'active':''}" onclick="cat='${c}';catalog()">${c}</button>`).join('')}</div><div class="rowtitle"><h2>${term?'Search results':'All products'}</h2><span class="muted">${a.length} products</span></div>${a.length?`<div class="grid">${a.map(card).join('')}</div>`:'<div class="empty">No products found. Try another search.</div>'}</div>`}
            function search(){term=document.getElementById('q').value.toLowerCase().trim();cat='All';catalog()}
            function detail(id){scrollTo(0,0);let p=get(id),related=P.filter(x=>x[0]!==id&&x[2]===p[2]).slice(0,4);if(related.length<4)related=related.concat(P.filter(x=>x[0]!==id&&!related.includes(x)).slice(0,4-related.length));document.getElementById('app').innerHTML=`<div class="wrap"><div class="crumb"><a onclick="home()">Home</a> / <a onclick="catalog()">Shop</a> / ${p[1]}</div><div class="detail"><div class="bigpic">${p[5]}</div><div><span class="muted">${p[6]} · ${p[2]}</span><h1>${p[1]}</h1><div class="stars">★★★★★ <span class="muted">4.8 / 5 · Demo rating</span></div><div class="price">${money(p[3])} <span class="old">${money(p[4])}</span></div><p>${p[7]}</p><p>Quantity: <button class="chip" onclick="qty(-1)">−</button> <b id="qty">1</b> <button class="chip" onclick="qty(1)">+</button></p><button onclick="add(${id},Number(document.getElementById('qty').textContent))">Add to cart</button> <button class="chip" onclick="cartPage()">Go to cart</button><div class="hint">🤖 <b>Recommended because:</b> This item matches the category you are exploring. A real recommendation engine would use your activity and preferences.</div></div></div>${products('You may also like',related,'Similar products selected by category')}</div>`;window.n=1}
            function qty(d){window.n=Math.max(1,Math.min(10,(window.n||1)+d));document.getElementById('qty').textContent=window.n}
            function add(id,n=1){let x=cart.find(x=>x.id===id);if(x)x.qty+=n;else cart.push({id,qty:n});sync();notify('Added to your cart ✓')}
            function remove(id){cart=cart.filter(x=>x.id!==id);sync();cartPage()}
            function cartPage(){scrollTo(0,0);let total=cart.reduce((s,x)=>s+get(x.id)[3]*x.qty,0);document.getElementById('app').innerHTML=`<div class="wrap"><div class="crumb"><a onclick="home()">Home</a> / Cart</div><h1>Your shopping cart</h1>${cart.length?`<div class="cartlayout"><div>${cart.map(x=>{let p=get(x.id);return `<div class="cartitem"><div class="mini">${p[5]}</div><div style="flex:1"><b>${p[1]}</b><div class="muted">${money(p[3])} · Qty ${x.qty}</div></div><b>${money(p[3]*x.qty)}</b><button class="chip" onclick="remove(${x.id})">Remove</button></div>`}).join('')}<button class="chip" onclick="catalog()">← Continue shopping</button></div><aside class="summary"><h3>Order summary</h3><div class="sumline"><span>Subtotal</span><b>${money(total)}</b></div><div class="sumline"><span>Delivery</span><b>FREE</b></div><hr><div class="sumline"><b>Total</b><b>${money(total)}</b></div><button style="width:100%" onclick="checkout()">Proceed to checkout</button><p class="muted" style="font-size:12px">Demo only — no payment will be taken.</p></aside></div>`:'<div class="empty"><div class="emoji">🛒</div><h2>Your cart is empty</h2><p class="muted">Add a product to see it here.</p><button onclick="catalog()">Explore products</button></div>'}</div>`}
            function checkout(){cart=[];sync();document.getElementById('app').innerHTML='<div class="wrap"><div class="empty"><div class="emoji">🎉</div><h1>Demo checkout complete!</h1><p class="muted">No real order or payment was placed.</p><button onclick="home()">Back to home</button></div></div>'}
            sync();home();
        </script>
    </body>
</html>
